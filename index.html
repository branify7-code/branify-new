    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            var rawFetch = window.fetch ? window.fetch.bind(window) : function() {
              return Promise.reject(new Error('Fetch not available'));
            };
            var activeFetch = rawFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return activeFetch;
              },
              set: function(fn) {
                if (typeof fn === 'function') {
                  activeFetch = fn;
                }
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (_) {}
      })();
    </script>
